<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG SQL Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            color: #e94560;
        }

        .header span {
            font-size: 13px;
            color: #888;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #0f3460;
        }

        .message.loading {
            background: #16213e;
            align-self: flex-start;
            border: 1px solid #0f3460;
            color: #888;
        }

        .input-area {
            background: #16213e;
            padding: 16px 24px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px 16px;
            color: #eee;
            font-size: 15px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #e94560;
        }

        .input-area button {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #c73652;
        }

        .input-area button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            margin: auto;
            color: #555;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #e94560;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🔮 RAG SQL Assistant</h1>
    <span>Powered by LangChain + Groq</span>
</div>

<div class="chat-container" id="chatContainer">
    <div class="welcome">
        <h2>Welcome!</h2>
        <p>Ask me anything about your data 💬</p>
    </div>
</div>

<div class="input-area">
    <input 
        type="text" 
        id="questionInput" 
        placeholder="Ask a question about your data..."
        onkeypress="handleKeyPress(event)"
    />
    <button id="sendBtn" onclick="sendQuestion()">Send</button>
</div>

<script>
    function handleKeyPress(event) {
        if (event.key === 'Enter') sendQuestion();
    }

    async function sendQuestion() {
        const input = document.getElementById('questionInput');
        const question = input.value.trim();
        if (!question) return;

        const container = document.getElementById('chatContainer');
        const sendBtn = document.getElementById('sendBtn');

        // Clear welcome message
        const welcome = container.querySelector('.welcome');
        if (welcome) welcome.remove();

        // Add user message
        container.innerHTML += `
            <div class="message user">${question}</div>
        `;

        // Add loading message
        const loadingId = 'loading-' + Date.now();
        container.innerHTML += `
            <div class="message loading" id="${loadingId}">⏳ Thinking...</div>
        `;

        // Clear input and disable button
        input.value = '';
        sendBtn.disabled = true;

        // Scroll to bottom
        container.scrollTop = container.scrollHeight;

        try {
            const response = await fetch('/ask/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });

            const data = await response.json();

            // Replace loading with answer
            document.getElementById(loadingId).outerHTML = `
                <div class="message bot">🤖 ${data.answer}</div>
            `;
        } catch (error) {
            document.getElementById(loadingId).outerHTML = `
                <div class="message bot">❌ Error: Could not get answer</div>
            `;
        }

        sendBtn.disabled = false;
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
